      5. **Forward-looking information.** This website contains
      forward-looking information within the meaning of applicable
      international securities legislation, including National Instrument
      51-102 Continuous Disclosure Obligations in Canada, and equivalent
      regulatory frameworks globally. Forward-looking information includes
      statements regarding the development, integration, and operational
