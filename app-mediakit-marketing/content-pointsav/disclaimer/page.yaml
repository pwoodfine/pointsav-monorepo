      References to "we," "our," or "the Company" in this disclaimer refer
      to Woodfine Capital Projects Inc.

      This website has been prepared solely for the purpose of providing
      information about Woodfine and its existing and proposed limited
      partnerships. By accessing this website, you acknowledge the
      following:

      1. **No warranty.** The content of this website is for information
      only. It does not constitute investment, legal, or other advice and
      should not be relied upon when making investment or other decisions.
      Woodfine makes no representation as to the completeness or accuracy of
      information on the website. While the information has been compiled in
      good faith, errors and omissions are possible. All information on this
      website may be deleted or amended without prior notice. Documents
      filed by Woodfine partnerships with securities regulators are current
      as at the respective dates on which they were filed. Woodfine makes no
      commitment to update any of these documents, except to the extent
      required by applicable securities laws and regulations.

      2. **No offer of securities.** The information contained on this
      website does not constitute an offer to sell, or the solicitation of
      an offer to buy, units in any of our partnerships. Any offer to sell
      interests in a Woodfine partnership may only be made by means of that
      partnership's Private Placement Memorandum, which contains detailed
      information concerning the terms and risks of an investment therein.

          Woodfine restricts the distribution of its securities globally to
          verified Accredited Investors and Qualified Investors under
          applicable statutory exemptions:

          | Jurisdiction | Applicable exemption framework |
          |---|---|
          | Canada | National Instrument 45-106 (Accredited Investor exemption); NI 51-102 (Continuous Disclosure Obligations) |
          | United States | Regulation D under the Securities Act of 1933 (unregistered securities) |
          | Latin America | Ley del Mercado de Valores of Mexico (LMV) and equivalent national frameworks |
          | European Union | EU Prospectus Regulation (EU 2017/1129) |

          Woodfine securities remain unregistered under the U.S. Securities
          Act of 1933 and under equivalent national securities laws in all
          other applicable jurisdictions. Woodfine prohibits sales in
          jurisdictions where such sales would not comply with applicable
          law.

      3. **Risk factors.** Investment in the partnerships managed by
