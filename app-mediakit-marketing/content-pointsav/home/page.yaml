title: ""
slug: home
description: A fully transferable data management and customer service platform for the procurement, development, and management of real properties.
lang: en
sections:
  - type: hero
    headline: A fully transferable data management platform
    subhead: >-
      PointSav Digital Systems builds customer-controlled software for independent
      property operators. Runs on hardware you control. No per-seat fees.
      No vendor lock-in.

  # Descriptor lines below are DRAFT — the wiki glossary entries for these
  # three terms are mostly placeholder stubs (see round-2 audit); these are
  # synthesized from pointsav-overview.md's mission-triad description
  # instead, re-polished round 3/5. See DESIGN-RESEARCH-icon-strip-mobile
  # .draft.md for the full sourcing trail.
  - type: icon-strip
    icons:
      - src: /static/graphics/pointsav/class-1.svg
        alt: Business Administration
        body: >-
          Everyday software tools that keep business operations organized
          and running smoothly.
      - src: /static/graphics/pointsav/class-2.svg
        alt: Record Keeping
        body: >-
          Secure recordkeeping that protects the one official version of
          every document.
      - src: /static/graphics/pointsav/class-3.svg
        alt: Building Connectivity
        body: >-
          Connects a building's physical systems and sensors so they work
          together.
        # Round 13 (2026-07-07): this icon's native aspect ratio (~0.81:1,
        # the narrowest of the 3 PointSav icons) renders it visibly smaller
        # than its siblings under the shared object-fit:contain box (see
        # IconTile::scale). A modest scale bump closes that visual gap.
        scale: 1.18

  - type: card-grid
    columns: 4
    cards:
      - title: Portability
        body: >-
          Every record is stored in open, documented formats, and the operating
          environment itself is a transferable disk image — not a subscription
          seat. If a customer changes technology providers, the data and the
          archive move with them; nothing is re-shaped, and nothing requires
          PointSav's cooperation.
      - title: Predictable Fees
        body: >-
          Partners pay a single platform fee calculated on assets under
          management rather than per-seat or per-module licensing. The
          commercial model is substrate ownership, not a price-per-seat
          subscription.
      - title: Partner-Governed Roadmap
        body: >-
          The product roadmap is governed by a closed council of operating
          partners. New modules ship into the existing license envelope;
          functionality is added without requiring migration to a new version or
          payment of additional license fees.
      - title: ToteBox Archive
        body: >-
          Every record is written to a WORM ledger inside a Totebox Archive —
          an append-only flat-file store with no delete or update verb, so the
          archive holds a complete, tamper-evident history of everything ever
          recorded. The archive is a transferable disk image, exportable in
          open formats at any time.
      - title: GIS Engine
        body: >-
          A customer-owned location intelligence engine runs offline-first from
          flat files on the customer's own filesystem — no central database, no
          live network dependency, no per-seat mapping subscription. Every
          spatial query and portfolio overlay executes against the customer's
          own map-tile archive.
      - title: Open Integrations
        body: >-
          PointSav uses open file formats and standard protocols — BACnet,
          MQTT, IFC, OAuth — with documented schemas. Integrations replace,
          rather than wrap, legacy point-solutions, and partners retain full
          ownership of their data and configuration.
      - title: Open Documentation
        body: >-
          Specifications, design system, API references, and source code
          repositories are maintained in a single repository accessible to
          operating partners. Every module ships with the documentation a
          successor team would need to operate independently.
      - title: Real Property Infrastructure
        href: https://home.woodfinegroup.com
        body: >-
          PointSav partners with Woodfine Management Corp. to deliver the
          digital infrastructure underpinning each Woodfine-sponsored
          direct-hold solution — BIM tokenization, location intelligence, and
          operational systems integrated across the project lifecycle.

