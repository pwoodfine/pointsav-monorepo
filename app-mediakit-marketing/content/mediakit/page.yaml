title: MediaKit
slug: mediakit
description: The engine that powers this site and the PointSav knowledge wikis.
lang: en
sections:
  - type: hero
    headline: MediaKit
    subhead: >-
      The shared engine platform behind this site and the PointSav
      knowledge wikis — server-rendered, self-hosted, no third-party
      trackers.

  - type: prose
    body: |
      This site is served by **MediaKit**, a family of Rust-based, server-rendered
      engines built and operated by PointSav Digital Systems. The same platform
      family also powers the PointSav knowledge wikis at
      [documentation.pointsav.com](https://documentation.pointsav.com/),
      [projects.woodfinegroup.com](https://projects.woodfinegroup.com/), and
      [corporate.woodfinegroup.com](https://corporate.woodfinegroup.com/).

      Content is authored as version-controlled, git-tracked files and rendered
      server-side on every request — there is no client-side page-building
      framework, and no third-party analytics or advertising scripts run on
      this site.
