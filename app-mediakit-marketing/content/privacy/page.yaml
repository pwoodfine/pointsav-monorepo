  - type: prose
    body: |
      ## This site does not use cookies

      home.woodfinegroup.com does not set cookies and does not run
      third-party analytics, advertising, or tracking scripts of any kind.
      No cookie-consent banner is shown because there is nothing to consent
      to.

      ## Server logs

      Like any web server, the infrastructure serving this site keeps
      standard access logs (requested URL, timestamp, and IP address) for
      operational and security purposes. These logs are not shared with
      third parties and are not used to build advertising profiles.

      ## Contact

      Questions about this policy can be sent to the address on the
      [Contact us](/page/contact) page.
