<svg class="class-icon" xmlns="http://www.w3.org/2000/svg" viewBox="-8.87 10.89 155.53 155.53" aria-label="Record Keeping">
          <!--
            Isometric archive boxes \u2014 three columns: 2 / 3 / 3.
            One unit-box symbol drawn so its base sits on y=0 (in symbol coords);
            we then place it via translate(...) per column. With box height = 22 in
            symbol coords, columns become:
              col A (left):   2 boxes  \u2192 top at y - 44
              col B (center): 3 boxes  \u2192 top at y - 66
              col C (right):  3 boxes  \u2192 top at y - 66
            The bottom row of every column rests on translate-y = 110 (floor).
          -->
          <defs>
            <symbol id="rkbx" overflow="visible">
              <!-- bottom face (right side, 3/4 view) -->
              <polygon points="32,0 41,-5 41,-22 32,-17" fill="#231F20"></polygon>
              <polygon points="32.4,-0.2 40.6,-4.8 40.6,-21.8 32.4,-17.2" fill="#B1B0B0"></polygon>
              <!-- box front face -->
              <rect x="0" y="-20" width="32" height="20" fill="#FFFFFF"></rect>
              <rect x="6" y="-15" width="20" height="4" fill="#E9E8E8"></rect>
              <rect x="8" y="-13.7" width="16" height="0.35" fill="#231F20" opacity="0.55"></rect>
              <rect x="8" y="-12.7" width="13" height="0.35" fill="#231F20" opacity="0.55"></rect>
              <rect x="11" y="-7" width="10" height="2.2" fill="#231F20" rx="1"></rect>
              <!-- front edges -->
              <rect x="-0.3" y="-20" width="0.6" height="20" fill="#231F20"></rect>
              <rect x="0" y="-0.3" width="32" height="0.6" fill="#231F20"></rect>
              <rect x="31.7" y="-20" width="0.6" height="20" fill="#231F20"></rect>
              <!-- lid (top face) -->
              <polygon points="34,-19.5 45,-26 45,-27 34,-20.5" fill="#231F20"></polygon>
              <polygon points="34,-20 45,-26.5 45,-33.5 34,-27" fill="#231F20"></polygon>
              <polygon points="34.3,-20.2 44.7,-26.7 44.7,-33.3 34.3,-26.8" fill="#B1B0B0"></polygon>
              <polygon points="-2,-27 9,-33.5 45,-33.5 34,-27" fill="#E9E8E8"></polygon>
              <rect x="-2" y="-27" width="36" height="7" fill="#E9E8E8"></rect>
              <rect x="-2" y="-20.4" width="36" height="0.7" fill="#231F20"></rect>
              <rect x="-2.3" y="-27" width="0.6" height="7" fill="#231F20"></rect>
              <rect x="33.7" y="-27" width="0.6" height="7" fill="#231F20"></rect>
              <rect x="-2" y="-27.3" width="36" height="0.6" fill="#231F20"></rect>
              <polygon points="-2,-27 9,-33.5 9.3,-33 -1.7,-26.5" fill="#231F20"></polygon>
              <polygon points="9,-33.7 45,-33.7 45,-33.1 9,-33.1" fill="#231F20"></polygon>
              <polygon points="34,-27 45,-33.5 45,-32.9 34,-26.4" fill="#231F20"></polygon>
              <polygon points="44.7,-33.5 45.3,-33.5 45.3,-26.5 44.7,-26.5" fill="#231F20"></polygon>
            </symbol>
          </defs>

          <!-- Column A: 2 boxes -->
          <g transform="translate(8, 120)">
            <use href="#rkbx" x="0" y="0"></use>
            <use href="#rkbx" x="0" y="-28"></use>
          </g>
          <!-- Column B: 3 boxes -->
          <g transform="translate(46, 120)">
            <use href="#rkbx" x="0" y="0"></use>
            <use href="#rkbx" x="0" y="-28"></use>
            <use href="#rkbx" x="0" y="-56"></use>
          </g>
          <!-- Column C: 3 boxes -->
          <g transform="translate(84, 120)">
            <use href="#rkbx" x="0" y="0"></use>
            <use href="#rkbx" x="0" y="-28"></use>
            <use href="#rkbx" x="0" y="-56"></use>
          </g>

                    <!-- label (no surrounding box) -->
          <text x="72" y="144" text-anchor="middle" font-family="'Trade Gothic LT Std Bold Condensed No. 20', 'Trade Gothic LT Std', 'TradeGothicLTStd-BdCn20', 'Trade Gothic Bold Condensed', 'Arial Narrow', 'Helvetica Condensed', sans-serif-condensed" font-size="13" font-weight="700" fill="#231F20" letter-spacing="0">RECORD KEEPING</text>
        </svg>