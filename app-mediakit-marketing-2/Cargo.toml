# app-mediakit-marketing-2 — ground-up rewrite of the marketing platform engine.
# Temporary `-2` name; renamed to `app-mediakit-marketing` at cutover (plan P8).
# 100% new code. Only third-party crates are shared with the retired engine;
# the retired app-mediakit-marketing + app-mediakit-shell are a read-only
# contract reference and anti-pattern catalogue, not a dependency.
[package]
name = "app-mediakit-marketing-2"
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
description = "Marketing platform engine (rewrite). Single binary, per-tenant env config, typed section-manifest content, server-rendered. Serves home.woodfinegroup.com / home.pointsav.com."
license = "FSL-1.1-ALv2"
publish = false

[[bin]]
name = "app-mediakit-marketing-2"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

# Deps grow phase by phase (see the phase program in NEXT.md / the plan of
# record). P0/P1 set: HTTP stack, templating, config, markdown, embedded assets.
[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "io-util"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-br", "compression-gzip"] }
maud = { version = "0.27", features = ["axum"] }
comrak = "0.52"
rust-embed = { version = "8", features = ["compression"] }
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
