[package]
name = "app-privategit-source-2"
version = "0.1.0"
edition = "2021"
description = "PointSav PrivateGit Source — ground-up rewrite (P0 scaffold, see BRIEF-software-ng-rewrite.md)"

[[bin]]
name = "app-privategit-source-2"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["set-header"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
ed25519-dalek = "2"
base64 = "0.22"
hex = "0.4"
chrono = "0.4"
sha2 = "0.10"
