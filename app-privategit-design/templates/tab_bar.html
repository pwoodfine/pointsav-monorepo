{% if tabs | length > 1 %}
<nav class="tab-bar" aria-label="Views">
{% for tab in tabs %}
<a href="/{{ section }}/{{ slug }}/{{ tab }}"{% if tab == active_tab %} class="active"{% endif %}>{{ tab | to_title }}</a>
{% endfor %}
</nav>
{% endif %}
