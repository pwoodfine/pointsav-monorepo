<details class="doc-toc__components-details">
<summary>{{ heading }} <span class="doc-toc__components-details-count">{{ slugs | length }}</span></summary>
<ul class="doc-toc__components">
{% for slug in slugs %}
<li><a href="/components/{{ slug }}/usage"{% if slug == active_slug %} class="active"{% endif %}>{{ slug | to_title }}</a></li>
{% endfor %}
</ul>
<div class="doc-toc__components-more">{{ slugs | length }} components.{% if see_also %} See also: <a href="{{ see_also }}">{{ heading }}</a>.{% endif %}</div>
</details>
