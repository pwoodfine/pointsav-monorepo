<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/portal.css">
<script>
(function(){var t=localStorage.getItem('design_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();
</script>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<header>
<a href="/">PointSav Design System</a>
<div class="header-search-wrap">
<svg class="header-search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
<input type="search" id="header-search-q" class="header-search" placeholder="Search…" aria-label="Search the design system" autocomplete="off">
<div id="search-autocomplete-dropdown" class="search-dropdown"></div>
</div>
<button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" type="button">
<svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
<svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
</button>
</header>
<div class="layout">
<nav class="sidebar" aria-label="Sections">{{ nav_html | safe }}</nav>
<main class="main" id="main-content">
{{ tab_bar | safe }}
{% if page_title %}<h1 class="page-title">{{ page_title }}</h1>
{% endif %}
<div class="content">{{ content | safe }}</div>
{{ footer_html | safe }}
</main>
</div>
<script>
var _es=new EventSource('/sidebar/sse');
_es.onmessage=function(e){var n=document.querySelector('nav.sidebar');if(n)n.innerHTML=e.data;};
</script>
<script defer src="/static/drawer.js"></script>
<script defer src="/static/edit.js"></script>
<script defer src="/static/ai.js"></script>
<script defer src="/static/tokens-gallery.js"></script>
<script defer src="/static/code-copy.js"></script>
<script defer src="/static/search.js"></script>
<script defer src="/static/theme-toggle.js"></script>
</body>
</html>
