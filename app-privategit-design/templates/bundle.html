<div class="bundle-list">
<p class="bundle-meta">{{ file_count }} files · <a class="bundle-download" href="/bundles/{{ name }}/download">Download bundle (.zip)</a></p>
<ul class="bundle-files">
{% for f in files %}
<li><a href="/bundles/{{ name }}/{{ f.filename }}">{{ f.title }}</a></li>
{% endfor %}
</ul>
</div>
