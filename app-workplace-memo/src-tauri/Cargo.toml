[package]
name = "workplace-memo"
version = "0.1.0"
description = "Sovereign local-first document editor — PointSav Digital Systems"
authors = ["PointSav Digital Systems"]
license = "EUPL-1.2"
repository = ""
edition = "2021"
rust-version = "1.70"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri v2 (migrated 2026-07-14). v1.x is unbuildable on this host — Ubuntu 24.04
# dropped webkit2gtk-4.0; v2 uses the 4.1/soup3 stack. macOS floor: 10.15+.
# Only tauri-plugin-dialog is needed: the frontend calls our own #[tauri::command]
# functions exclusively (no __TAURI__.fs/shell/path JS), and file I/O + the picker
# are all Rust-side. The old fs-*/path-all/shell-open features were never used by
# the actual code.
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.21"

[features]
# This feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# ─── Notes ──────────────────────────────────────────────────────────────────
# For Linux (Tauri v2) production build, replace the tauri dependency with:
#
# tauri = { version = "2", features = [] }
# tauri-plugin-fs = "2"
# tauri-plugin-dialog = "2"
#
# And update [build-dependencies]:
# tauri-build = { version = "2", features = [] }
#
# The IPC command signatures in src/main.rs require minor updates for v2's
# plugin-based file system API. See DEVELOPMENT.md for the migration guide.

[workspace]
