<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workplace GIS</title>
  <link rel="stylesheet" href="vendor/maplibre-gl/maplibre-gl.css" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
    }
    #app {
      display: flex;
      height: 100vh;
      width: 100vw;
    }
    #map {
      flex: 1;
      position: relative;
    }
    #sidebar {
      width: 260px;
      flex-shrink: 0;
      background: #181825;
      border-right: 1px solid #313244;
      padding: 0.75rem;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      overflow-y: auto;
    }
    #sidebar h1 {
      font-size: 0.95rem;
      margin: 0 0 0.25rem;
    }
    #sidebar .endpoint {
      font-size: 0.75rem;
      color: #a6adc8;
      word-break: break-all;
    }
    .layer-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-top: auto;
    }
    button, .link-button {
      font-family: inherit;
      font-size: 0.85rem;
      padding: 0.45rem 0.75rem;
      border-radius: 6px;
      border: 1px solid #45475a;
      background: #313244;
      color: #cdd6f4;
      cursor: pointer;
    }
    button.primary {
      background: #89b4fa;
      color: #1e1e2e;
      border-color: #89b4fa;
      font-weight: 600;
    }
    button:hover { filter: brightness(1.1); }
    /* First-run / error overlay, shown over #map until a tile session is live */
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e1e2ecc;
      z-index: 10;
    }
    #overlay.hidden { display: none; }
    .panel {
      text-align: center;
      max-width: 420px;
      padding: 1rem;
    }
    .setup-form input {
      font-family: inherit;
      font-size: 0.95rem;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      border: 1px solid #45475a;
      background: #11111b;
      color: #cdd6f4;
      width: 260px;
      text-align: center;
      margin-bottom: 1rem;
    }
    .setup-form label {
      display: block;
      margin-bottom: 0.5rem;
      color: #a6adc8;
      font-size: 0.85rem;
    }
    .error-detail {
      color: #a6adc8;
      font-size: 0.8rem;
      margin: 0.5rem 0 1.25rem;
    }
    .maplibregl-popup-content {
      background: #181825;
      color: #cdd6f4;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <h1>Workplace GIS</h1>
      <div class="endpoint" id="endpoint-label">not configured</div>
      <div id="layer-list"></div>
      <div class="actions">
        <button id="load-geojson-btn">Load GeoJSON overlay…</button>
        <button id="export-btn">Export current view</button>
        <button id="change-endpoint-btn">Change endpoint…</button>
      </div>
    </div>
    <div id="map">
      <div id="overlay">
        <div class="panel" id="overlay-panel">
          <p>Loading…</p>
        </div>
      </div>
    </div>
  </div>
  <script src="vendor/maplibre-gl/maplibre-gl.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
