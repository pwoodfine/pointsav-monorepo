# app-mediakit-knowledge-2 — ground-up rewrite of the knowledge wiki engine.
# Temporary `-2` name; renamed to `app-mediakit-knowledge` at cutover (plan P8).
# 100% new code. Only third-party crates are shared with the retired engine.
[package]
name = "app-mediakit-knowledge-2"
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
description = "PointSav knowledge wiki engine (rewrite). Single binary, flat-file Markdown source-of-truth, Git-versioned, Wikipedia-structured."
license = "Apache-2.0"
publish = false

[[bin]]
name = "app-mediakit-knowledge-2"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

# Deps grow phase by phase (see plan virtual-twirling-parasol P0–P5).
# P0/P1 set: HTTP stack, templating, config, markdown, embedded assets.
[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "io-util"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "set-header", "compression-br", "compression-gzip"] }
maud = { version = "0.27", features = ["axum"] }
comrak = { version = "0.52", features = ["syntect"] }
rust-embed = { version = "8", features = ["compression"] }
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
anyhow = "1"
thiserror = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
