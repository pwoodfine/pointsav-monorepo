[package]
name = "app-privategit-marketplace-2"
version = "0.1.0"
edition = "2021"
description = "PointSav PrivateGit Marketplace — ground-up rewrite (P0 scaffold, see BRIEF-software-ng-rewrite.md)"

[[bin]]
name = "app-privategit-marketplace-2"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
maud = "0.27"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tower-http = { version = "0.5", features = ["fs", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
hex = "0.4"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = "2"
base64 = "0.22"
